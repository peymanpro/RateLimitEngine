name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RateLimitEngine.sln

      - name: Build
        run: dotnet build RateLimitEngine.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RateLimitEngine.sln --configuration Release --no-build

      - name: Pack
        run: |
          mkdir -p artifacts/ci
          dotnet pack src/RateLimitEngine.Core/RateLimitEngine.Core.csproj --configuration Release --no-build --output artifacts/ci
          dotnet pack src/RateLimitEngine.Algorithms/RateLimitEngine.Algorithms.csproj --configuration Release --no-build --output artifacts/ci
          dotnet pack src/RateLimitEngine.Redis/RateLimitEngine.Redis.csproj --configuration Release --no-build --output artifacts/ci
          dotnet pack src/RateLimitEngine.AspNetCore/RateLimitEngine.AspNetCore.csproj --configuration Release --no-build --output artifacts/ci

      - name: Validate packages
        shell: bash
        run: |
          VERSION="$(dotnet msbuild src/RateLimitEngine.Core/RateLimitEngine.Core.csproj -getProperty:PackageVersion | tail -n 1)"
          test -n "$VERSION"
          test -f "artifacts/ci/RateLimitEngine.Core.$VERSION.nupkg"
          test -f "artifacts/ci/RateLimitEngine.Algorithms.$VERSION.nupkg"
          test -f "artifacts/ci/RateLimitEngine.Redis.$VERSION.nupkg"
          test -f "artifacts/ci/RateLimitEngine.AspNetCore.$VERSION.nupkg"
