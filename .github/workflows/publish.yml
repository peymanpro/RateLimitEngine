name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published GitHub Release tag to publish to NuGet.org (for example, v1.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build, Test and Publish NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis-timeout:
        image: redis:7-alpine
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out the exact GitHub Release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate release tag and package version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          package_version="$(dotnet msbuild src/RateLimitEngine.Core/RateLimitEngine.Core.csproj -getProperty:PackageVersion | tail -n 1)"
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid package version: $package_version" >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v$package_version" ]] || {
            echo "::error::Release tag $RELEASE_TAG does not match package version $package_version." >&2
            exit 1
          }
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore RateLimitEngine.sln

      - name: Build
        run: dotnet build RateLimitEngine.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RateLimitEngine.sln --configuration Release --no-build

      - name: Pack NuGet packages
        run: |
          mkdir -p artifacts
          dotnet pack src/RateLimitEngine.Core/RateLimitEngine.Core.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/RateLimitEngine.Algorithms/RateLimitEngine.Algorithms.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/RateLimitEngine.Redis/RateLimitEngine.Redis.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/RateLimitEngine.AspNetCore/RateLimitEngine.AspNetCore.csproj --configuration Release --no-build --output artifacts

      - name: Validate packages and test real package consumers
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: bash .github/scripts/validate-nuget-packages.sh "$PACKAGE_VERSION" artifacts

      - name: NuGet login via Trusted Publishing (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: peyman9722

      - name: Publish packages and symbols to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
